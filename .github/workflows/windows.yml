name: Windows

# The Windows receiver (windows/) needs the Windows SDK APIs it wraps (Media
# Foundation, Direct3D 11), so it is built and linted on a Windows runner. It
# shares the network and session code of the Linux receiver (linux/crates).
on:
  pull_request:
    paths:
      - "windows/**"
      - "MacReceiver/Assets.xcassets/AppIcon.appiconset/**"
      - "linux/crates/od-receiver/**"
      - "linux/crates/opendisplay-proto/**"
      - "linux/crates/opendisplay-session/**"
      - "PROTOCOL.md"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "linux/crates/od-receiver/**"
      - "linux/crates/opendisplay-proto/**"
      - "linux/crates/opendisplay-session/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  receiver:
    name: receiver (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build "OpenDisplay Receiver.exe"
        run: ./build.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-Receiver-windows-x86_64
          path: windows/dist/OpenDisplay Receiver.exe
          if-no-files-found: error
